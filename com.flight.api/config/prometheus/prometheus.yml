global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # OTel Collector self-metrics
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  # OTel Collector Prometheus exporter (flight service metrics)
  - job_name: flight-api
    static_configs:
      - targets: ['otel-collector:8889']
